<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ClearView</title><link rel="stylesheet" href="popup.css"></head><body>
<header><div class="mark">CV</div><div><h1>ClearView</h1><p>Make the web make sense.</p></div><a href="../options/options.html" title="Settings">⚙</a></header>
<main><div class="status"><span></span><strong>Local protection on</strong><small>No browsing history collected</small></div>
<label class="toggle"><span><b>Dismiss safe popups</b><small>Skips non-essential overlays, never login or payment dialogs.</small></span><input id="popups" type="checkbox"><i></i></label>
<label class="toggle"><span><b>Mark broken links</b><small>Yellow underline for missing, invalid or empty destinations.</small></span><input id="links" type="checkbox"><i></i></label>
<label class="toggle"><span><b>Surface download buttons</b><small>Highlights likely file actions without clicking them.</small></span><input id="downloads" type="checkbox"><i></i></label>
<label class="toggle"><span><b>Focus mode</b><small>Quiet sidebars, ads and motion. Alt+Shift+F also toggles it.</small></span><input id="focus" type="checkbox"><i></i></label>
<button id="diagnostics" class="secondary">Run page health check</button><button id="options" class="link">More settings &amp; safety notes →</button>
</main><footer>ClearView 1.0 · Your page stays on your device</footer><script src="popup.js"></script></body></html>
